services:
  - type: web
    name: khilane-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: OZOW_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: khilane-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://khilane-api.onrender.com
