services:
    - type: web
    name: khilane-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
            - key: DATABASE_URL
        sync: false
            - key: PAYSTACK_SECRET_KEY
        sync: false
            - key: PAYFAST_MERCHANT_ID
        sync: false
            - key: OZOW_API_KEY
        sync: false
            - key: NODE_ENV
        value: production

    - type: web
    name: khilane-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
